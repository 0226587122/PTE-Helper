# DigitalOcean App Platform spec for the PTE practice app.
#
# Before the first deploy:
#   1. The repository below is 0226587122/PTE-Helper on the main branch.
#   2. Create the Managed MySQL cluster named below (see README, "Deploy to DigitalOcean").
#   3. Replace the two REPLACE_ME secrets, or leave them and set the values in the control panel.
#      App Platform encrypts SECRET values once the spec is applied. Never commit real values.
#
# Checked against the App Platform spec reference in September 2026. Field names change from time to time,
# so check https://docs.digitalocean.com/products/app-platform/reference/app-spec/ if a deploy is rejected.

name: pte-practice
region: syd

ingress:
  rules:
    # The API's routes already start with /api, so keep the prefix when forwarding.
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: api
    github:
      repo: 0226587122/PTE-Helper
      branch: main
      deploy_on_push: true
    # Build from the repository root so the Dockerfile can copy the question bank in seed/.
    source_dir: /
    dockerfile_path: backend/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: ENVIRONMENT
        value: production
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      - key: JWT_SECRET
        type: SECRET
        value: REPLACE_ME
        scope: RUN_TIME
      - key: ANTHROPIC_API_KEY
        type: SECRET
        value: REPLACE_ME
        scope: RUN_TIME
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
        scope: RUN_TIME
      - key: COOKIE_SECURE
        value: "true"
        scope: RUN_TIME
      - key: QUESTIONS_PER_SET
        value: "15"
        scope: RUN_TIME
      - key: MIN_ACTIVE_PER_TYPE
        value: "30"
        scope: RUN_TIME
      - key: RECENT_SETS_EXCLUDED
        value: "3"
        scope: RUN_TIME
      - key: REPORT_RETIRE_THRESHOLD
        value: "3"
        scope: RUN_TIME
      - key: FEEDBACK_DAILY_LIMIT
        value: "30"
        scope: RUN_TIME
      - key: WEB_CONCURRENCY
        value: "2"
        scope: RUN_TIME

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: 0226587122/PTE-Helper
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: backend/Dockerfile
    run_command: alembic upgrade head
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: ENVIRONMENT
        value: production
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME

static_sites:
  - name: web
    github:
      repo: 0226587122/PTE-Helper
      branch: main
      deploy_on_push: true
    source_dir: frontend
    environment_slug: node-js
    # Include dev dependencies: the build needs TypeScript and Vite.
    build_command: npm ci --include=dev && npm run build
    output_dir: dist
    # Send unknown paths to the React app so client-side routes like /practice/12 work on refresh.
    catchall_document: index.html

databases:
  # App Platform dev databases are PostgreSQL only, so MySQL is an attached Managed MySQL cluster.
  - name: db
    engine: MYSQL
    version: "8"
    production: true
    cluster_name: pte-mysql
    db_name: pte
    db_user: pte
